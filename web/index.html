<!-- Loading screen. Plain CSS, because the Tailwind runtime below only styles the page after React mounts;
     app.jsx keeps this up until that stylesheet and the fonts have settled, so no half-styled frame shows.
     Only transform and opacity animate, so it keeps moving while the main thread builds the page. -->
<style>
#boot{--ink:#0a0a0a;position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#fff;transition:opacity .4s ease .22s,visibility 0s linear .65s}
html.dark #boot{--ink:#f1f1f3;background:#19191b}
#boot[data-done]{opacity:0;visibility:hidden}
#boot .in{display:flex;flex-direction:column;align-items:center;gap:22px;transition:transform .6s cubic-bezier(.5,0,.2,1)}
#boot[data-done] .in{transform:scale(1.18)}
#boot .mark{display:grid;grid-template-columns:repeat(11,10px);gap:3px}
#boot .mark i,#boot .bar i{display:block;width:10px;height:10px;border-radius:1px;background:var(--ink);opacity:.08}
#boot .mark i.on{opacity:1;animation:boot-in .55s cubic-bezier(.34,1.56,.64,1) var(--d) both,boot-wave 1.8s ease-in-out calc(var(--d) + .9s) infinite}
#boot .mark i:not(.on){animation:boot-twinkle 2.6s steps(1) var(--r) infinite}
#boot .word{font:500 13px/1 "Geist Pixel","Geist Mono",ui-monospace,monospace;letter-spacing:.2em;color:var(--ink)}
#boot .tag{margin-top:-12px;font:400 13px/1.4 Geist,system-ui,sans-serif;color:var(--ink);opacity:.55;animation:boot-fade .6s ease .5s both}
#boot .bar{display:flex;gap:2px}
#boot .bar i{width:8px;height:8px;transition:opacity .2s ease}
#boot .bar i.on{opacity:1}
#boot .bar i.next{animation:boot-blink .7s steps(1) infinite}
#boot .msg{min-height:14px;font:500 11px/14px "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.5}
/* On the way out the lit pixels burst outward from the mark while the screen zooms through and fades. */
#boot[data-done] .mark i.on{animation:boot-out .6s cubic-bezier(.5,0,.75,0) var(--o) forwards}
#boot[data-done] .mark i:not(.on),#boot[data-done] .word,#boot[data-done] .tag,#boot[data-done] .bar,#boot[data-done] .msg{animation:none;opacity:0;transition:opacity .2s ease}
@keyframes boot-in{0%{opacity:0;transform:translateY(-14px) scale(.4)}100%{opacity:1;transform:none}}
@keyframes boot-out{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4)}}
@keyframes boot-fade{from{opacity:0;transform:translateY(4px)}}
@keyframes boot-wave{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes boot-twinkle{0%,88%{opacity:.08}89%,100%{opacity:.3}}
@keyframes boot-blink{0%{opacity:.55}50%{opacity:.08}}
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important}#boot[data-done] .in{transform:none}}
</style>

/* App shell on phones and tablets: sheets rise from the bottom, cards leave like a swiped deck, the tab bar pops. */

/* Page transitions (route.js sets data-nav on <html> and starts a view transition, compact screens only).

@layer base {

@layer components {

<body>
<div id="boot" role="status" aria-live="polite"><div class="in"><div class="mark" aria-hidden="true"></div><div class="word">DECISION BENCH</div><div class="tag">Real records, answered by their source.</div><div class="bar" aria-hidden="true"></div><div class="msg">Waking up</div></div></div>
<script>
/* "DB" in a 5×7 pixel face. Lit pixels drop in column by column, then a wave runs across them; the rest twinkle.
   Each lit pixel also gets a direction away from the centre, which it flies along when the screen lifts. */
(function(){
  var g=['11110011110','10001010001','10001010001','10001011110','10001010001','10001010001','11110011110'],b=document.getElementById('boot'),m=b.querySelector('.mark'),bar=b.querySelector('.bar'),h='',n=20;
  function burst(x,y){var dx=x-5,dy=y-3,a=Math.atan2(dy,dx)+(Math.random()-.5)*.6,r=90+Math.random()*160+Math.hypot(dx,dy)*14;return '--dx:'+(Math.cos(a)*r).toFixed(0)+'px;--dy:'+(Math.sin(a)*r).toFixed(0)+'px;--rot:'+((Math.random()-.5)*160).toFixed(0)+'deg;--o:'+(Math.random()*90).toFixed(0)+'ms';}
  g.forEach(function(row,y){for(var x=0;x<row.length;x++)h+=row[x]==='1'?'<i class="on" style="--d:'+(x*45+y*18)+'ms;'+burst(x,y)+'"></i>':'<i style="--r:'+(-Math.random()*2.6).toFixed(2)+'s"></i>';});
  m.innerHTML=h;for(var i=0,s='';i<n;i++)s+='<i></i>';bar.innerHTML=s;
  /* app.jsx reports progress through this: a message and how far along, 0 to 1. */
  window.dbBoot=function(msg,f){var k=Math.round(Math.max(0,Math.min(1,f))*n);if(msg)b.querySelector('.msg').textContent=msg;[].forEach.call(bar.children,function(e,j){e.className=j<k?'on':j===k?'next':'';});};
  window.dbBoot('',.1);
})();
</script>
