name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate corpus, model config and published results
        run: python3 -m decision_bench validate
      - name: Scan for secrets, private hostnames and home paths
        run: python3 scripts/check_secrets.py
      - name: Build the site data
        run: python3 -m decision_bench report
      - name: Viewer and analytics regression tests
        run: node --test web/tests/*.test.mjs
      - name: Build the viewer
        run: npm ci --prefix web && npm run build --prefix web
