name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Install Pillow for the image resizing tests
        run: python3 -m pip install pillow==13.0.0
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate corpus, model config and published results
        run: python3 -m decision_bench validate
      - name: Scan for secrets, private hostnames and home paths
        run: python3 scripts/check_secrets.py
      - name: Build the site data
        run: python3 -m decision_bench report
      - name: Viewer and analytics regression tests
        run: node --test web/tests/*.test.mjs
      - name: Build the viewer
        run: npm ci --prefix web && npm run build --prefix web
