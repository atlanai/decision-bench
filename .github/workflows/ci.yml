name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate corpus, model config and published results
        run: python3 -m decision_bench validate
      - name: Scan for secrets, private hostnames and home paths
        run: python3 scripts/check_secrets.py
      - name: Build the site data
        run: python3 -m decision_bench report
      - name: Check site JavaScript
        run: for f in site/*.js; do node --check "$f"; done
      - name: Test populated viewer and hostile URL filters
        run: node --test tests/test_site.cjs
