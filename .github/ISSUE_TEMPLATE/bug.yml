name: Bug
description: The harness, a command or the site does something wrong.
title: "Bug: <short description>"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Command and output
      description: The exact command and the error. Remove API keys, endpoint URLs and local paths before pasting.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, Ubuntu 24.04"
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
