[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-bench"
version = "1.0"
description = "Decision Bench: how accurately, quickly and cheaply language models make bounded decisions"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
decision-bench = "decision_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["decision_bench*"]
